# Do not change!
js7.component.name = "JS7 Agent Director"

js7.journal {
  log {
    key-events += "AgentEvent"
    key-events += "UnsignedSimpleItemAdded"  # For registered Subagent
    key-events += "SubagentDedicated"
    key-events += "SubagentCoupled"
    key-events += "SubagentCouplingFailed"
    key-events += "SubagentRestarted"
    key-events += "SubagentShutdown"
  }
}

js7.web.server {
  auth.realm = "JS7 Agent"
}

js7.subagent-driver.reconnect-delays = [
  0.5s, 0.5s, 1s, 1s, 1s, 1s,
  1s, 1s, 1s, 2s,
  2s, 2s, 2s, 4s,
  5s, 5s,
  10s ]

# Throttle ReleaseEvents commands to reduce HTTP traffic and corresponding CPU usage.
# ReleaseEvents(a) replaces all earlier ReleaseEvents(a') where a' <= a.
# A long delay limits event throughput, because MemoryJournal may fill up and has to wait for
# the (then uselessly) delayed ReleaseEvents command.
# 20/s is a good rate for TestAddOrders with many very short internal jobs).
# 0s is equivalent to no throttling
js7.subagent-driver.release-events-delay = 50ms
